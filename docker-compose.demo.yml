# Public DEMO stack — runs alongside the private prod stack on the same EC2.
#
# Differs from docker-compose.prod.yml in:
#   - Different published ports (3001 frontend, 8001 api) so it doesn't clash
#   - Separate Postgres volume (pgdata_demo) - fully isolated data
#   - Separate config file (config.demo.json) with demo_mode: true
#   - Different project name via container_name to keep `docker ps` readable
#
# Usage on EC2 (after both .env.demo and config.demo.json are populated):
#   sudo docker compose -p trajectory-demo -f docker-compose.demo.yml --env-file .env.demo up -d --build
#   sudo docker compose -p trajectory-demo -f docker-compose.demo.yml logs -f
#
# To stop just the demo stack:
#   sudo docker compose -p trajectory-demo -f docker-compose.demo.yml down

services:
  db:
    image: postgres:16-alpine
    container_name: trajectory-demo-db
    environment:
      POSTGRES_USER: trajectory
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD}
      POSTGRES_DB: trajectory
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajectory -d trajectory"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: ./backend
    container_name: trajectory-demo-api
    volumes:
      - ./backend/config.demo.json:/app/config.json:ro
    environment:
      DATABASE_URL: postgresql+psycopg://trajectory:${DEMO_DB_PASSWORD}@db:5432/trajectory
    ports:
      - "8001:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${DEMO_PUBLIC_API_URL}
        NEXT_PUBLIC_GA_ID: ${DEMO_GA_ID:-}
    container_name: trajectory-demo-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${DEMO_PUBLIC_API_URL}
      NEXT_PUBLIC_GA_ID: ${DEMO_GA_ID:-}
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata_demo:
