<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Browser at top -->
<rect x="260" y="30" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Browser</text>
<text x="340" y="70" text-anchor="middle" font-size="12" fill="#888780">Desktop or mobile</text>

<!-- Arrow into EC2 -->
<line x1="340" y1="80" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="350" y="105" font-size="12" fill="#888780">HTTP/S</text>

<!-- EC2 outer container -->
<rect x="60" y="120" width="560" height="240" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="148" font-size="14" font-weight="500" fill="#0C447C">AWS EC2 t4g.small (ARM, eu-west-2)</text>

<!-- Frontend container -->
<rect x="100" y="180" width="180" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="190" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Frontend</text>
<text x="190" y="226" text-anchor="middle" font-size="12" fill="#534AB7">Next.js 14 · port 3000</text>

<!-- Backend container -->
<rect x="100" y="270" width="180" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Backend API</text>
<text x="190" y="316" text-anchor="middle" font-size="12" fill="#0F6E56">FastAPI · port 8000</text>

<!-- Postgres container -->
<rect x="400" y="270" width="180" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="490" y="296" text-anchor="middle" font-size="14" font-weight="500" fill="#633806"> Database</text>
<text x="490" y="316" text-anchor="middle" font-size="12" fill="#854F0B">PostgreSQL 16 · Docker</text>

<!-- Frontend -> Backend -->
<line x1="190" y1="244" x2="190" y2="268" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="200" y="260" font-size="12" fill="#888780">REST/JSON</text>

<!-- Backend -> Database -->
<line x1="280" y1="302" x2="398" y2="302" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="339" y="294" text-anchor="middle" font-size="12" fill="#888780">SQL</text>

<!-- OpenAI external -->
<rect x="400" y="180" width="180" height="64" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="206" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">OpenAI API</text>
<text x="490" y="226" text-anchor="middle" font-size="12" fill="#993C1D">GPT-5 family</text>

<!-- Backend -> OpenAI -->
<line x1="280" y1="290" x2="400" y2="220" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="345" y="248" font-size="12" fill="#888780">HTTPS</text>

<!-- Bottom caption -->
<rect x="60" y="395" width="560" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Single instance, all in Docker</text>
<text x="340" y="438" text-anchor="middle" font-size="12" fill="#888780">~$15/month · scales to ~$50/month for 50 users</text>
</svg>
